# Web Security Analytics business policies.
#
# Kept separate from application.yml (imported via spring.config.import) so the security
# vocabulary and scoring model can be tuned/reviewed independently of infrastructure
# config. Bound at startup by WsaPolicyProperties (@ConfigurationProperties prefix
# "wsa.policies"). All entries are key-value maps so keys drive validation while values
# carry human-readable names / numeric scores.
wsa:
  policies:
    # Allowed attack categories: canonical key -> display name. The KEYS are the
    # authoritative vocabulary the validator checks rule.category against.
    categories:
      INJECTION: "SQL/Command Injection"
      XSS: "Cross-Site Scripting"
      PROTOCOL_VIOLATION: "Protocol Anomaly"
      DATA_LEAKAGE: "Data Exfiltration"
      BOT: "Bot Activity"
      DOS: "Denial of Service"
      RATE_LIMIT: "Rate Limiting"

    # Severity -> risk score contribution.
    severity-scores:
      CRITICAL: 40
      HIGH: 30
      MEDIUM: 20
      LOW: 10

    # Enforcement action -> risk score contribution.
    action-scores:
      DENY: 20
      ALERT: 10
      MONITOR: 0

    # Threat-scoring tunables applied during enrichment.
    scoring:
      # Extra points when the request targets a sensitive path (see sensitive-paths).
      sensitive-path-bonus: 15
      # Extra points when the client IP is flagged as a repeat offender.
      repeat-offender-bonus: 15
      # Hard cap on the final threat score.
      max-score: 100
      # Path fragments considered sensitive (case-insensitive "contains" match).
      sensitive-paths:
        - /admin
        - /login

    # Sliding-window rate limiting per client IP (Redis-backed).
    rate-limit:
      # Length of the sliding window.
      window: 10m
      # An IP is a repeat offender when its event count within the window exceeds this.
      threshold: 5

