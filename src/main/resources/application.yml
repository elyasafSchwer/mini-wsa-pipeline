spring:
  application:
    name: MiniWSA
  # Profile groups. Activating `standalone` (fully in-memory: no Elasticsearch, no Redis,
  # no Docker) automatically activates `dev` as well, so the dev-only tooling (e.g. the
  # /api/dev data-generation endpoints) is available in a self-contained run.
  profiles:
    group:
      standalone: [dev]
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # Business rules (attack categories, scoring) live in a dedicated policy file so this
  # file stays limited to server/spring/infrastructure concerns.
  config:
    import: classpath:wsa-policies.yml
  # Redis backs the per-IP sliding-window rate tracker. Overridable via the standard
  # SPRING_DATA_REDIS_* environment variables in each environment.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  # Elasticsearch backs long-term storage of enriched events (index: security-events).
  # Local dev target is an unsecured single-node ES 8.x on localhost:9200 (see
  # docker-compose.yml). No credentials/TLS here since xpack.security is disabled; in
  # secured environments set SPRING_ELASTICSEARCH_URIS plus username/password/SSL.
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 5s

# Storage tuning. Enriched events are buffered and written to Elasticsearch in bulk
# (_bulk) rather than one document per event. A batch is flushed when it reaches
# `batch-size` documents OR `flush-interval-ms` elapses — whichever comes first — so
# throughput is high while indexing latency stays bounded under low traffic.
wsa:
  storage:
    batch-size: ${WSA_STORAGE_BATCH_SIZE:500}
    flush-interval-ms: ${WSA_STORAGE_FLUSH_INTERVAL_MS:1000}
